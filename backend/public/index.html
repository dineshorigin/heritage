<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pallanguzhi — room backend test</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Pallanguzhi</h1><span class="badge">Backend test · v0.1</span></header><p>This is a room-server test board. Your existing heritage game is separate.</p><section id="setup"><label>Your name <input id="name" maxlength="18" value="Player"></label><details><summary>Create-room settings</summary><label>Seeds <select id="seeds"><option>5</option><option>4</option></select></label><label>Format <select id="format"><option value="single">Single match</option><option value="kasie">Kasie</option></select></label><label>Pasu <select id="pasu"><option value="on">On</option><option value="off">Off</option></select></label></details><div class="row"><button id="create">Create room</button><label>Room code <input id="code" maxlength="8" autocomplete="off"></label><button id="join">Join room</button><button id="rejoin">Reconnect saved seat</button></div></section><p id="status" role="status">Create or join a room.</p><section id="game" hidden><div class="row"><strong id="room"></strong><span id="presence"></span><button id="ready">Ready</button><button id="start">Start</button><button id="sync">Sync board</button><button id="disconnect">Disconnect</button><button id="reconnect">Reconnect</button></div><p id="turn" role="status"></p><div id="scores" class="row"></div><div id="board" aria-label="Pallanguzhi test board"></div><div class="row"><button id="pause">Pause</button><button id="resume">Resume</button><button id="next">Next round</button><button id="rematch">Rematch</button></div><label>Simulated playback delay <select id="delay"><option value="0">Immediate</option><option value="1500">1.5 seconds</option><option value="5000">5 seconds</option></select></label><p>Delay simulates a slower phone. The server blocks the next move until both clients finish. Real seed animation will be integrated separately.</p><pre id="details"></pre></section></main><script type="module" src="client.js"></script></body></html>
